# 기본 설정. 환경별 값은 환경변수로 덮어쓴다.
# ml-service의 Settings(PCAI_ 접두사)와 같은 원칙 — 알고리즘 상수는
# 코드에, 배포 환경마다 달라지는 운영 파라미터만 여기에.

spring:
  application:
    name: personal-color-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personalcolor}
    username: ${DB_USERNAME:personalcolor}
    password: ${DB_PASSWORD:personalcolor}

  jpa:
    open-in-view: false  # 컨트롤러에서 지연 로딩이 터지는 것을 막는다
    hibernate:
      ddl-auto: validate  # 스키마는 Flyway가 소유한다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 12MB      # ml-service의 PCAI_MAX_UPLOAD_BYTES와 맞춘다
      max-request-size: 16MB

server:
  port: ${SERVER_PORT:8080}

# ml-service 연동
ml-service:
  base-url: ${ML_SERVICE_URL:http://127.0.0.1:8000}
  # 추론은 수백 ms가 정상이다. 넉넉히 두되 무한 대기는 막는다.
  timeout: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.personalcolor: INFO
