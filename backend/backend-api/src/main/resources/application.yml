# 기본 설정. 환경별 값은 환경변수로 덮어쓴다.
# ml-service의 Settings(PCAI_ 접두사)와 같은 원칙 — 알고리즘 상수는
# 코드에, 배포 환경마다 달라지는 운영 파라미터만 여기에.

spring:
  application:
    name: personal-color-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personalcolor}
    username: ${DB_USERNAME:personalcolor}
    password: ${DB_PASSWORD:personalcolor}

  jpa:
    open-in-view: false  # 컨트롤러에서 지연 로딩이 터지는 것을 막는다
    hibernate:
      ddl-auto: validate  # 스키마는 Flyway가 소유한다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  servlet:
    multipart:
      max-file-size: 12MB      # ml-service의 PCAI_MAX_UPLOAD_BYTES와 맞춘다
      max-request-size: 16MB

server:
  port: ${SERVER_PORT:8080}

# 관리자 부트스트랩 (ADR-011). JWT 키와 달리 없어도 기동한다 —
# 관리자 기능은 부가 기능이라 없다고 서비스를 세우는 것은 과잉이다.
# 이메일이 있으면 해당 계정을 만들거나(비밀번호 규칙은 가입과 동일)
# 이미 있으면 ADMIN으로 승격한다. 기존 비밀번호는 덮어쓰지 않는다.
pcai:
  admin:
    email: ${PCAI_ADMIN_EMAIL:}
    password: ${PCAI_ADMIN_PASSWORD:}

jwt:
  # 기본값을 두지 않는다. 기본 서명 키는 그대로 배포되고, 소스가 공개된
  # 프로젝트에서 그것은 누구나 토큰을 위조할 수 있다는 뜻이다.
  # 없으면 기동이 실패한다 — 조용히 뚫려 있는 것보다 낫다.
  #   생성 예: openssl rand -base64 48
  secret: ${PCAI_JWT_SECRET}
  access-token-ttl: 12h
  issuer: personal-color-ai

# ml-service 연동
ml-service:
  base-url: ${ML_SERVICE_URL:http://127.0.0.1:8000}
  # 추론은 수백 ms가 정상이다. 넉넉히 두되 무한 대기는 막는다.
  timeout: 20s
  # 같은 이미지는 항상 같은 결과다(ml-service가 무상태·결정론적).
  cache-ttl: 24h
  # 서킷 브레이커 — ImageRejectedException(사진 문제)은 실패로 세지 않는다.
  circuit-failure-rate-threshold: 50
  circuit-wait-duration: 30s
  circuit-sliding-window-size: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.personalcolor: INFO
    # 요청 완료 로그(RequestObservabilityFilter). actuator 프로브는 DEBUG로
    # 내려가 있어 이 레벨(INFO)에서는 보이지 않는다 — 의도된 동작.
    http.request: INFO
  # 구조화(JSON) 로그는 여기서 켜지 않는다. 로컬 개발은 사람이 읽는
  # 텍스트가 낫고, 컨테이너에서만 환경변수로 켠다:
  #   LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs  (docker-compose.yml)
  # ecs(Elastic Common Schema)를 고른 이유는 ADR-008 참조. MDC의
  # correlationId가 별도 필드로 실려 요청 단위 검색이 된다.
