# 전체 스택 로컬 실행.
#
#   docker compose up --build
#
# 설계 원칙 하나: **ml-service를 호스트에 노출하지 않는다.** 그 서비스에는
# 인증이 없고 내부 네트워크 전제로 만들어졌다(01-architecture §9).
# 게이트웨이만 8080을 열고, ml-service는 Compose 네트워크 안에서만 보인다.

name: personal-color-ai

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-personalcolor}
      POSTGRES_USER: ${DB_USERNAME:-personalcolor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-personalcolor}
    volumes:
      - db-data:/var/lib/postgresql/data
    # DB만 호스트에 연다. 데이터를 직접 확인할 일이 실제로 있기 때문이다.
    # 포트가 겹치면 .env에서 DB_PORT를 바꾼다. 운영에서는 이 매핑을 지운다.
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      # pg_isready만으로는 부족하다 — 초기화 스크립트가 도는 동안에도
      # 잠깐 준비됨으로 보고하는 구간이 있어, 실제 DB 이름까지 확인한다.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-personalcolor} -d ${DB_NAME:-personalcolor}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    # 캐시 전용이라 영속화를 끈다. 재시작하면 캐시가 비지만, 그건
    # 성능 문제일 뿐 정확성 문제가 아니다(CachingAnalyzer 참조).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # 호스트에 열지 않는다. 게이트웨이가 Compose 네트워크 안에서 서비스
    # 이름으로 접근하므로 필요가 없고, 6379는 다른 프로젝트와 충돌하기
    # 쉬운 포트다. 들여다볼 일이 있으면 아래로 붙는다.
    #   docker compose exec redis redis-cli
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build:
      context: ./ml-service
    environment:
      PCAI_DETECTOR_POOL_SIZE: ${ML_DETECTOR_POOL_SIZE:-2}
      # 컨테이너 로그는 수집기가 읽는다 — 사람용 텍스트 대신 JSON.
      # 로컬 개발(uv run uvicorn)은 이 변수가 없어 텍스트로 나온다.
      PCAI_LOG_FORMAT: json
    # 포트를 노출하지 않는다 — 위 주석 참조.
    # 디버깅이 필요하면 아래 두 줄의 주석을 풀고 127.0.0.1로 접속한다.
    # ports:
    #   - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      # 모델 로딩(검출기 풀 크기만큼)에 시간이 걸린다. 이 값이 짧으면
      # 정상 기동 중인 컨테이너가 unhealthy로 찍힌다.
      start_period: 45s

  backend:
    build:
      context: ./backend
    depends_on:
      # service_started가 아니라 service_healthy다. DB가 포트를 연 것과
      # 쿼리를 받을 준비가 된 것은 다르고, 그 사이에 Flyway가 돌면 실패한다.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-personalcolor}
      DB_USERNAME: ${DB_USERNAME:-personalcolor}
      DB_PASSWORD: ${DB_PASSWORD:-personalcolor}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_SERVICE_URL: http://ml-service:8000
      # 기본값을 주지 않는다. .env에 없으면 Compose가 빈 값을 넘기고
      # 애플리케이션이 기동을 거부한다 — 의도된 동작이다(JwtProperties).
      PCAI_JWT_SECRET: ${PCAI_JWT_SECRET}
      # 컨테이너에서만 구조화(ECS JSON) 로그를 켠다. 로컬은 텍스트가
      # 읽기 좋고, 수집기 앞에서는 JSON이어야 필드 검색이 된다 (ADR-008).
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      # 관리자 부트스트랩 (ADR-011). 비어 있으면 관리자 기능만 꺼진 채
      # 정상 기동한다 — JWT 키와 달리 필수가 아니다.
      PCAI_ADMIN_EMAIL: ${PCAI_ADMIN_EMAIL:-}
      PCAI_ADMIN_PASSWORD: ${PCAI_ADMIN_PASSWORD:-}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  web:
    build:
      context: ./web
      args:
        # Next 서버가 /api/* 를 이 주소로 중계한다 (next.config.ts).
        # 브라우저는 web만 보고, 게이트웨이 주소를 알 필요가 없다.
        # ⚠️ 런타임 environment가 아니라 빌드 인자다 — rewrites 설정은
        # 빌드 시점에 standalone 출력으로 직렬화되기 때문 (web/Dockerfile).
        API_PROXY_TARGET: http://backend:8080
    depends_on:
      # 프론트 자체는 백엔드 없이도 뜨지만, 프록시 대상이 없는 상태로
      # healthy가 되면 --wait가 "스택 정상"을 잘못 보고한다.
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      # 알파인 이미지라 curl이 없다 — Node 22 내장 fetch로 대신한다.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  db-data:
