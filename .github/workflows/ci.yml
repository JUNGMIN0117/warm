# CI — 푸시와 PR마다 두 서비스를 각각 검증한다.
#
# 잡을 나눈 이유는 병렬성과 **실패 지점의 명확성**이다. 하나로 합치면
# "CI 실패"만 보이고 어느 서비스가 깨졌는지 로그를 열어봐야 한다.
#
# Testcontainers는 Docker 데몬을 요구하는데, GitHub의 ubuntu 러너에는
# Docker가 기본 탑재되어 있어 별도 설정 없이 동작한다.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연속 푸시하면 이전 실행을 취소한다. 최신 커밋의 결과만
# 의미가 있고, 러너 시간을 아낀다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ml-service:
    name: ML 서비스 (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml-service

    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.1"
          enable-cache: true
          cache-dependency-glob: ml-service/uv.lock

      - name: 의존성 설치
        # --frozen: 락파일과 다르면 조용히 갱신하지 않고 실패한다.
        # CI에서 의존성이 표류하면 "로컬은 되는데 CI만 깨지는" 상황이 생긴다.
        run: uv sync --frozen

      - name: 린트 (ruff)
        run: uv run ruff check .

      - name: 타입 검사 (mypy strict)
        run: uv run mypy app/ tests/ scripts/

      - name: 테스트
        # 모델 가중치를 받지 않고 돌린다. MediaPipe 실추론 테스트는
        # 파일이 없으면 skip되도록 설계되어 있어(test_face_detector.py),
        # 모델 없이도 나머지 회귀를 전부 잡는다. 다운로드 시간과
        # 외부 의존을 CI에서 없애려는 의도다.
        run: uv run pytest -q

  backend:
    name: 백엔드 (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 빌드와 테스트
        # verify에 Testcontainers 통합 테스트가 포함된다 — 진짜
        # PostgreSQL 16과 Redis 7 컨테이너가 뜬다.
        run: ./mvnw -B verify

      - name: 테스트 리포트 업로드
        # 실패했을 때만. 성공한 실행의 리포트는 아무도 보지 않는다.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

  images:
    name: 컨테이너 이미지 빌드
    runs-on: ubuntu-latest
    # 두 서비스가 통과한 뒤에만 돈다. 코드가 깨진 상태의 이미지를
    # 빌드하는 것은 러너 시간 낭비다.
    needs: [ml-service, backend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: ml-service 이미지
        uses: docker/build-push-action@v6
        with:
          context: ./ml-service
          # 푸시하지 않는다. 레지스트리가 아직 없고, 여기서 확인하려는
          # 것은 "Dockerfile이 깨지지 않았는가"뿐이다.
          push: false
          cache-from: type=gha,scope=ml-service
          cache-to: type=gha,scope=ml-service,mode=max

      - name: backend 이미지
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  compose:
    name: Compose 종단 기동
    runs-on: ubuntu-latest
    needs: [images]

    steps:
      - uses: actions/checkout@v4

      - name: .env 생성
        # 운영 코드가 JWT 시크릿에 기본값을 두지 않으므로 CI에서도
        # 명시적으로 만들어야 한다. 이 값은 이 실행에서만 쓰인다.
        run: echo "PCAI_JWT_SECRET=$(openssl rand -base64 48)" > .env

      - name: 스택 기동
        # --wait: 모든 healthcheck가 통과할 때까지 기다린다.
        # 이것만으로 "4개 서비스가 올바른 순서로 뜨는가"가 검증된다.
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: 종단 호출 확인
        run: |
          set -euo pipefail

          echo "--- health ---"
          curl -fsS http://127.0.0.1:8080/actuator/health

          echo "--- 계절 카탈로그 (DB 시드 확인) ---"
          count=$(curl -fsS http://127.0.0.1:8080/api/v1/seasons | grep -o '"code"' | wc -l)
          test "$count" -eq 4 || { echo "계절이 4개가 아님: $count"; exit 1; }

          echo "--- 인증 없는 이력 조회는 401 ---"
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/analyses)
          test "$status" = "401" || { echo "401이 아님: $status"; exit 1; }

          echo "--- 깨진 이미지는 400 ---"
          echo "not an image" > /tmp/bad.png
          status=$(curl -s -o /dev/null -w '%{http_code}' \
                   -F "image=@/tmp/bad.png" http://127.0.0.1:8080/api/v1/analyses)
          test "$status" = "400" || { echo "400이 아님: $status"; exit 1; }

          echo "종단 확인 통과"

      - name: 실패 시 로그
        if: failure()
        run: docker compose logs --tail 120

      - name: 정리
        if: always()
        run: docker compose down -v
