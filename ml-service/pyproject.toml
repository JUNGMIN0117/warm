[project]
name = "personal-color-ml"
version = "0.1.0"
description = "퍼스널 컬러 분석 ML 서비스"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# ×(곱셈 기호)는 docstring 수식 표기로 의도적으로 사용한다 (docs/03-color-theory.md와 표기 통일).
allowed-confusables = ["×"]

[tool.mypy]
python_version = "3.12"
strict = true
