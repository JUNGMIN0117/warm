[project]
name = "personal-color-ml"
version = "0.1.0"
description = "퍼스널 컬러 분석 ML 서비스"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    # mediapipe가 opencv-contrib-python을 요구하므로 headless 대신 이쪽을 직접 선언한다.
    # 두 flavor(cv2 제공 패키지)가 공존하면 임포트가 깨지기 때문에 flavor를 통일해야 한다.
    "opencv-contrib-python>=4.10",
    "mediapipe>=1.0",
    # 이미지 디코딩은 cv2.imdecode가 아니라 Pillow를 쓴다 — cv2는 EXIF
    # Orientation을 무시해서 폰 세로 사진이 눕는다 (pipeline.py 참조).
    "pillow>=11.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    # multipart/form-data 업로드 파싱. FastAPI의 UploadFile이 요구한다.
    "python-multipart>=0.0.20",
]

# PEP 735 dependency-groups — 배포 대상이 아닌 개발 도구는 optional-dependencies가 아니라
# 여기 둔다. `uv sync`가 기본으로 dev 그룹까지 설치한다.
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # starlette TestClient의 HTTP 백엔드. 최신 starlette은 httpx2를 요구하고
    # httpx 1.x를 쓰면 DeprecationWarning을 낸다.
    "httpx2>=0.29",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
# ×(곱셈 기호)는 docstring 수식 표기로 의도적으로 사용한다 (docs/03-color-theory.md와 표기 통일).
allowed-confusables = ["×"]

[tool.mypy]
python_version = "3.12"
strict = true

# mediapipe는 타입 스텁을 제공하지 않는다. 파이프라인 계층에서만 쓰이고
# 도메인 계층은 여전히 strict 전체 검사를 받는다.
[[tool.mypy.overrides]]
module = ["mediapipe.*"]
ignore_missing_imports = true
